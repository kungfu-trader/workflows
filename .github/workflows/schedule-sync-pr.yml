name: Schedule - Sync GitHub Pull Request to Airtable
on:
  workflow_dispatch:
    inputs:
      enable-legacy-sync:
        description: 'Type enable to run the retired legacy PR sync action'
        required: true
        default: 'disabled'

jobs:
  full-sync-pr:
    if: ${{ github.event.inputs.enable-legacy-sync == 'enable' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: kungfu-systems/action-sync-pr@v1.0-alpha
        with:
          token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          apiKey: ${{ secrets.AIRTABLE_API_KEY }}
          base: ${{ secrets.AIRTABLE_BASE_ID }}
