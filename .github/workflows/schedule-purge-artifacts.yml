name: Schedule - Purge GitHub Artifacts
on:
  workflow_dispatch:
    inputs:
      enable-legacy-purge:
        description: 'Type enable to run the retired legacy artifact purge action'
        required: true
        default: 'disabled'

jobs:
  delete-artifacts:
    if: ${{ github.event.inputs.enable-legacy-purge == 'enable' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: kungfu-systems/action-purge-artifacts@v1
        with:
          token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          expire-in: 7days
