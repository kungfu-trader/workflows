on:
  workflow_call:
    inputs:
      prebuild:
        default: true
        type: boolean
        required: false
      node-version:
        default: "24"
        type: string
        required: false
      builder-container:
        default: "docker.io/kungfutrader/kungfu-builder-ubuntu:v1.0.0"
        type: string
        required: false
      enable-linux:
        default: true
        type: boolean
        required: false
      enable-macos:
        default: true
        type: boolean
        required: false
      enable-windows:
        default: true
        type: boolean
        required: false
      build-runner-linux-labels:
        default: ""
        type: string
        required: false
      publish-versioning:
        default: true
        type: boolean
        required: false
      publish-aws-ci:
        default: true
        type: boolean
        required: false
      publish-aws-user:
        default: true
        type: boolean
        required: false
      action-bump-version-repository:
        default: "kungfu-systems/action-bump-version"
        type: string
        required: false
      action-bump-version-ref:
        default: "v3"
        type: string
        required: false
    secrets:
      NODE_AUTH_TOKEN:
        required: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Bump Version Action
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.action-bump-version-repository }}
          ref: ${{ inputs.action-bump-version-ref }}
          path: node_modules/.github-actions/action-bump-version
          persist-credentials: false

      - name: Verify Version
        if: ${{ github.event_name == 'pull_request' }}
        run: node node_modules/.github-actions/action-bump-version/dist/index.js
        env:
          KUNGFU_ACTION_BUMP_VERSION_ALLOW_LOCAL: "true"
          INPUT_TOKEN: ${{ github.token }}
          INPUT_ACTION: "verify"

  build-linux:
    if: >-
      ${{
        inputs.prebuild &&
        inputs.enable-linux &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    needs: prepare
    runs-on: ${{ fromJSON(inputs.build-runner-linux-labels || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Show Runner
        run: |
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@kungfu-trader"

      - name: Setup Node.js registry scope
        if: ${{ inputs.publish-versioning }}
        uses: actions/setup-node@v6
        with:
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"

      - name: Install Dependencies
        run: yarn --network-timeout=1000000 install --frozen-lockfile

      - name: Build
        run: yarn run build

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            yarn run lint
          else
            echo "No lint script"
          fi
