on:
  workflow_call:
    inputs:
      prebuild:
        default: true
        type: boolean
        required: false
      node-version:
        default: "16"
        type: string
        required: false
      builder-container:
        default: "docker.io/kungfutrader/kungfu-builder-ubuntu:v1.0.0"
        type: string
        required: false
      enable-linux:
        default: true
        type: boolean
        required: false
      enable-macos:
        default: true
        type: boolean
        required: false
      enable-windows:
        default: true
        type: boolean
        required: false
      build-runner-linux-labels:
        default: ""
        type: string
        required: false
      publish-versioning:
        default: true
        type: boolean
        required: false
      publish-aws-ci:
        default: true
        type: boolean
        required: false
      publish-aws-user:
        default: true
        type: boolean
        required: false
      action-bump-version-repository:
        default: "kungfu-systems/action-bump-version"
        type: string
        required: false
      action-bump-version-ref:
        default: "v3"
        type: string
        required: false
    secrets:
      NODE_AUTH_TOKEN:
        required: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout Bump Version Action
        uses: actions/checkout@v3
        with:
          repository: ${{ inputs.action-bump-version-repository }}
          ref: ${{ inputs.action-bump-version-ref }}
          path: node_modules/.github-actions/action-bump-version
          persist-credentials: false

      - name: Verify Version
        if: ${{ github.event_name == 'pull_request' }}
        run: node node_modules/.github-actions/action-bump-version/dist/index.js
        env:
          KUNGFU_ACTION_BUMP_VERSION_ALLOW_LOCAL: "true"
          INPUT_TOKEN: ${{ github.token }}
          INPUT_ACTION: "verify"

  build:
    if: >-
      ${{
        inputs.prebuild &&
        inputs.enable-linux &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    needs: prepare
    runs-on: [self-hosted, Linux, X64, agent-120, kungfu-build, linux-x64]
    container: ${{ inputs.builder-container }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://npm.pkg.github.com"
          scope: "@kungfu-trader"

      - name: Build
        run: |
          yarn --network-timeout=1000000 install --frozen-lockfile
          yarn run build

  verify:
    if: ${{ always() }}
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check build result
        if: ${{ inputs.prebuild && needs.build.result != 'success' }}
        run: |
          echo "::error::Linux build result was ${{ needs.build.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout Bump Version Action
        uses: actions/checkout@v3
        with:
          repository: ${{ inputs.action-bump-version-repository }}
          ref: ${{ inputs.action-bump-version-ref }}
          path: node_modules/.github-actions/action-bump-version
          persist-credentials: false

      - name: Verify Version
        if: ${{ github.event_name == 'pull_request' }}
        run: node node_modules/.github-actions/action-bump-version/dist/index.js
        env:
          KUNGFU_ACTION_BUMP_VERSION_ALLOW_LOCAL: "true"
          INPUT_TOKEN: ${{ github.token }}
          INPUT_ACTION: "verify"
